name: Deploy Full GitOps Stack (ArgoCD + Monitoring + App)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLUSTER_NAME: private-eks-cluster

jobs:
  deploy:
    name: Deploy via Bastion Runner
    runs-on: [aws-ssm-runner]

    steps:
      # 🔹 1. Checkout main repo (optional)
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔹 2. Verify AWS identity
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 🔹 3. Configure kubeconfig
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      # 🔹 4. Ensure kubectl
      - name: Ensure kubectl installed
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi

      # 🔹 5. Ensure Helm
      - name: Ensure Helm installed
        run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

      # 🔹 6. Create namespaces
      - name: Create namespaces
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace online-boutique --dry-run=client -o yaml | kubectl apply -f -

      # 🔹 7. Install / Upgrade ArgoCD
      - name: Install ArgoCD
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --set server.service.type=ClusterIP

      # 🔹 8. Wait for ArgoCD pods
      - name: Wait for ArgoCD pods
        run: |
          for deploy in $(kubectl get deploy -n argocd -o jsonpath='{.items[*].metadata.name}'); do
            echo "Waiting for $deploy"
            kubectl rollout status deployment/$deploy -n argocd --timeout=120s
          done

      # 🔹 9. Wait for ArgoCD CRDs
      - name: Wait for ArgoCD CRDs
        run: |
          kubectl wait --for condition=Established \
            crd/applications.argoproj.io \
            --timeout=120s

      # 🔹 10. Checkout GitOps repo
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOYMENT_REPO }}
          ref: ${{ vars.DEPLOYMENT_REPO_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      # 🔹 11. Apply ALL ArgoCD Applications (GitOps way)
      - name: Apply ArgoCD Applications
        run: |
          kubectl apply -f gitops-repo/crds.yaml -n argocd
          kubectl apply -f gitops-repo/prometheus.yaml -n argocd
          kubectl apply -f gitops-repo/grafana.yaml -n argocd
          kubectl apply -f gitops-repo/servicemonitor.yaml -n argocd
          kubectl apply -f gitops-repo/application.yaml -n argocd

      # 🔹 12. Verify ArgoCD Applications
      - name: Verify ArgoCD Applications
        run: |
          kubectl get applications -n argocd

      # 🔹 13. Get ArgoCD Service
      - name: Get ArgoCD Service
        run: |
          kubectl get svc -n argocd

      # 🔹 14. Get Monitoring Services
      - name: Get Monitoring Services
        run: |
          kubectl get svc -n monitoring
          