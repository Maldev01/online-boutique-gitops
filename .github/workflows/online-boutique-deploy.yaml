name: Deploy App (GitOps)

on:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  AWS_REGION: ${{secrets.AWS_REGION}}
  CLUSTER_NAME: private-eks-cluster

jobs:
  deploy:
    name: Deploy via Bastion Runner
    runs-on: [Linux]

    steps:
      # 🔹 1. Checkout main repo (optional)
      - name: Checkout repo
        uses: actions/checkout@v4

      # 🔹 2. Verify IAM role (EC2 role will be used automatically)
      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      # 🔹 3. Update kubeconfig for private EKS
      - name: Configure kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region $AWS_REGION \
            --name $CLUSTER_NAME

      # 🔹 4. Install kubectl (only if not pre-installed)
      - name: Ensure kubectl installed
        run: |
          if ! command -v kubectl &> /dev/null; then
            curl -LO "https://dl.k8s.io/release/$(curl -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi

      # 🔹 5. Install Helm (only if not pre-installed)
      - name: Ensure Helm installed
        run: |
          if ! command -v helm &> /dev/null; then
            curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
          fi

      # 🔹 6. Create required namespaces
      - name: Create namespaces
        run: |
          kubectl create namespace argocd --dry-run=client -o yaml | kubectl apply -f -
          kubectl create namespace online-boutique --dry-run=client -o yaml | kubectl apply -f -

      # 🔹 7. Add ArgoCD Helm repo
      - name: Add Helm repo
        run: |
          helm repo add argo https://argoproj.github.io/argo-helm
          helm repo update

      # 🔹 8. Install / Upgrade ArgoCD
      - name: Install ArgoCD
        run: |
          helm upgrade --install argocd argo/argo-cd \
            --namespace argocd \
            --set server.service.type=LoadBalancer

      # 🔹 9. Wait for ArgoCD pods
      - name: Wait for ArgoCD pods
        run: |
          for deploy in $(kubectl get deploy -n argocd -o jsonpath='{.items[*].metadata.name}'); do
            echo "Waiting for $deploy"
            kubectl rollout status deployment/$deploy -n argocd --timeout=80s
          done

      # 🔹 10. Wait for ArgoCD CRDs
      - name: Wait for CRDs
        run: |
          kubectl wait --for condition=Established \
            crd/applications.argoproj.io \
            --timeout=120s

      # 🔹 11. Checkout GitOps repo
      - name: Checkout GitOps repo
        uses: actions/checkout@v4
        with:
          repository: ${{ vars.DEPLOYMENT_REPO }}
          ref: ${{ vars.DEPLOYMENT_REPO_BRANCH }}
          token: ${{ secrets.GITOPS_TOKEN }}
          path: gitops-repo

      # 🔹 12. Apply ArgoCD Application
      - name: Apply ArgoCD Application
        run: |
          kubectl apply -f gitops-repo/application.yaml -n argocd

      # 🔹 13. Verify Application
      - name: Verify ArgoCD Application
        run: |
          kubectl get applications -n argocd

      # 🔹 14. Get ArgoCD URL
      - name: Get ArgoCD URL
        run: |
          kubectl get svc argocd-server -n argocd

      # monitoring step
      - name: Deploy Monitoring Stack (ArgoCD)
        run: |
          kubectl apply -f gitops-repo/monitoring.yaml -n argocd    
          