apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring-stack
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 56.6.2

    helm:
      values: |
        # 🔥 CRITICAL FIX
        crds:
          enabled: true

        prometheusOperator:
          enabled: true

        prometheus:
          enabled: true
          service:
            type: ClusterIP

        grafana:
          enabled: true
          service:
            type: LoadBalancer

          # 🔥 Fix datasource explicitly
          additionalDataSources:
            - name: Prometheus
              type: prometheus
              url: http://monitoring-stack-kube-prom-prometheus.monitoring:9090
              access: proxy
              isDefault: true

          # Optional (easy login)
          adminPassword: admin123

        alertmanager:
          enabled: true

  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true