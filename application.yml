apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: online-boutique
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/MalharKt/online-boutique-gitops'
    targetRevision: main
    path: 'helmchart'
    helm:
      valueFiles:
        - values.yml
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: online-boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true